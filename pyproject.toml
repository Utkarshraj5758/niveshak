[project]
name = "niveshak"
version = "0.1.0"
description = "Manipulation-risk scoring for Indian stock tips"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "duckdb>=1.0",
    "pandas>=2.2",
    "requests>=2.32",
    "typer>=0.12",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "lightgbm>=4.3",
    "scikit-learn>=1.5",
    "shap>=0.45",
    "networkx>=3.3",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "pymupdf>=1.24",
    "telethon>=1.36",
]

[project.optional-dependencies]
asr = ["yt-dlp>=2024.5.27", "faster-whisper>=1.0"]
nlp = ["transformers>=4.42", "torch>=2.3"]
dev = ["pytest>=8.2", "ruff>=0.5", "mypy>=1.10", "pre-commit>=3.7"]

[project.scripts]
niveshak = "niveshak.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/niveshak"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["niveshak.score.*", "niveshak.parse.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

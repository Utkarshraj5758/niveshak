# Lexicons for the rule parser. Edit these word lists here — they are intentionally NOT
# hardcoded in Python so the vocabulary can be tuned without touching parser logic.
#
# Notes:
# - Terms are matched case-insensitively. Multi-word phrases match as phrases.
# - Emoji are real signal in this domain (🚀 🔥) and are kept, never stripped.
# - Hinglish (Hindi in Latin script) sits alongside English throughout.

# Trade direction the message is pushing.
direction:
  long:
    - buy
    - long
    - lelo
    - le lo
    - lena
    - khareedo
    - kharido
    - accumulate
    - add
    - entry
    - buy karo
    - tezi
    - bullish
    - breakout
    - upar
    - upside
    - target up
  short:
    - sell
    - short
    - bech do
    - becho
    - bechna
    - mandi
    - bearish
    - short karo
    - downside
    - put buy

# Urgency tiers. 'high' includes act-now pressure and hype emoji; 'medium' is softer.
urgency:

    - turant
    - aaj hi
    - sirf aaj
    - jaldi
    - fast
    - hurry
    - immediately
    - last chance
    - dont miss
    - "don't miss"
    - miss mat karna
    - limited time
    - act now
    - quick
    - blast
    - bumper
    - "🚀"
    - "🔥"
    - "⚡"
    - "💥"
    - "🚨"
  medium:
    - today
    - aaj
    - soon
    - is week
    - this week
    - kal
    - tomorrow
    - book fast


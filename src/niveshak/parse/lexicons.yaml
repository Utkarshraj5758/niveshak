# Investment horizon keywords -> days. Regex handles explicit "N days/weeks/months".
horizon:
  intraday:        # 1 session
    - intraday
    - scalping
    - scalp
    - aaj ka
    - today only
    - btst
  positional:      # ~5 sessions
    - positional
    - swing
    - is hafte
  long_term:       # unbounded -> null
    - long term
    - longterm
    - long-term
    - invest
    - delivery
    - years
    - saal
